name: tests

# 只跑单元测试当闸门。
# 为什么不是全量：集成测试要真的开 QML 窗口，本地 QT_QPA_PLATFORM=offscreen 下跑
# 全量会崩（跑到中途访问违例），不能拿来当合并闸门。集成测试继续在本机跑。
#
# 分支流程：feature → PR 到 dev → 这里跑 → 人 review + merge；dev 稳定后合到 main。

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  # 同一个 PR 连着推两次，把前一次没跑完的取消掉，别排长队
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (pytest tests/unit)
    runs-on: windows-latest          # pywin32 / win32api 只在 Windows 上装得上
    timeout-minutes: 20

    env:
      # 单元测试不建真窗口，offscreen 最省事（本地实测 636 条全过，约 4 秒）
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment.yml

      - name: 装依赖
        # 一行写完，不靠 shell 的续行符（windows-latest 默认 pwsh、别的 shell 是 bash）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyside6 opencv-python-headless numpy pywin32 pytest pytest-mock "agent-framework>=1.22" "agent-framework-openai>=1.17" "openai>=3.35"

      - name: 单元测试
        run: python -m pytest tests/unit -q

      - name: 失败时留下现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/chaita.log
            logs/crash.log
          if-no-files-found: ignore
          retention-days: 7
